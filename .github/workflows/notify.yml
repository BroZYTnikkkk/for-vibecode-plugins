name: Notify Telegram

on:
  push:
  create:
  delete:
  watch:
  fork:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram Topic
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: 81
          format: html
          message: |
            ${{ github.event_name == 'push' && format('<b>📝 Push</b> in <code>{0}</code><br><br>{1}<br><br><a href="{2}">View commit</a>', github.repository, github.event.head_commit.message, github.event.head_commit.url) || '' }}${{ github.event_name == 'create' && format('<b>✨ Created</b> <code>{0}</code> in <code>{1}</code><br><br><a href="{2}">View on GitHub</a>', github.event.ref, github.repository, github.event.repository.html_url) || '' }}${{ github.event_name == 'delete' && format('<b>🗑️ Deleted</b> <code>{0}</code> from <code>{1}</code><br><br><a href="{2}">View on GitHub</a>', github.event.ref, github.repository, github.event.repository.html_url) || '' }}${{ github.event_name == 'watch' && format('<b>⭐ New star</b> on <code>{0}</code><br><br>Total stars: {1}<br><br><a href="{2}">View on GitHub</a>', github.repository, github.event.repository.stargazers_count, github.event.repository.html_url) || '' }}${{ github.event_name == 'fork' && format('<b>🍴 New fork</b> of <code>{0}</code><br><br>By: <code>{1}</code><br><br><a href="{2}">View fork</a>', github.repository, github.event.forkee.owner.login, github.event.forkee.html_url) || '' }}${{ github.event_name == 'issues' && format('<b>📌 Issue {0}</b> in <code>{1}</code><br><br>{2}<br><br><a href="{3}">View issue</a>', github.event.action, github.repository, github.event.issue.title, github.event.issue.html_url) || '' }}${{ github.event_name == 'pull_request' && format('<b>🔀 PR {0}</b> in <code>{1}</code><br><br>{2}<br><br><a href="{3}">View PR</a>', github.event.action, github.repository, github.event.pull_request.title, github.event.pull_request.html_url) || '' }}
